org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Local workaround: the Kotlin Build Tools API daemon races on Windows when
# multiple plugin modules compile in parallel (observed as spurious
# "Storage ... is already registered" IllegalStateExceptions). Serializing
# workers avoids the race; safe to remove once upstream fixes it.
org.gradle.workers.max=1
org.gradle.parallel=false
